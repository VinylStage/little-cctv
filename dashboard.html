<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>little-cctv</title>
<style>
  :root { --bg:#0e0f13; --panel:#181a21; --panel2:#20232c; --line:#2b2f3a;
          --tx:#e8eaf0; --mut:#8b90a0; --acc:#3b82f6; --rec:#ef4444; --ok:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx);
         font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  header .dot { width:8px; height:8px; border-radius:50%; background:var(--mut); }
  header .dot.live { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #rec-badge { margin-left:auto; display:none; align-items:center; gap:6px; color:var(--rec); font-weight:600; }
  #rec-badge.on { display:flex; }
  #rec-badge .rd { width:9px; height:9px; border-radius:50%; background:var(--rec); animation:blink 1s steps(2,start) infinite; }
  #rec-badge.paused .rd { animation:none; opacity:.5; }
  @keyframes blink { 50% { opacity:.2; } }
  main { max-width:920px; margin:0 auto; padding:16px; }
  .stage { position:relative; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; }
  video { width:100%; height:100%; display:block; background:#000; object-fit:contain; }
  .offline { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:8px; text-align:center; color:var(--tx);
             background:rgba(0,0,0,.6); font-weight:600; padding:16px; }
  .offline small { font-weight:400; color:var(--mut); }
  .offline[hidden] { display:none; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:14px; }
  .panel h2 { margin:0 0 10px; font-size:12px; font-weight:600; color:var(--mut); text-transform:uppercase; letter-spacing:.6px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  button { font:inherit; color:var(--tx); background:var(--panel2); border:1px solid var(--line);
           border-radius:9px; padding:9px 14px; cursor:pointer; transition:.12s; }
  button:hover { border-color:#3a4050; }
  button:active { transform:translateY(1px); }
  button.active { background:var(--acc); border-color:var(--acc); color:#fff; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.rec { background:var(--rec); border-color:var(--rec); color:#fff; }
  button.rec:disabled { background:var(--panel2); border-color:var(--line); color:var(--tx); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .vol { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .vol input { flex:1; accent-color:var(--acc); }
  .hint { color:var(--mut); font-size:12px; margin-top:8px; }
  .sub { color:var(--mut); font-size:12px; font-weight:600; margin:10px 0 6px; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#000d;
           border:1px solid var(--line); padding:10px 16px; border-radius:10px; opacity:0;
           transition:.2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>little-cctv</h1>
  <span id="rec-badge"><span class="rd"></span><span id="rec-time">REC 00:00</span></span>
</header>

<main>
  <div class="stage">
    <video id="v" playsinline autoplay muted></video>
    <div id="offline" class="offline" hidden>
      <div>카메라 신호 없음</div>
      <small>다른 앱(OBS 등)이 카메라를 사용 중인지 확인하세요.<br>카메라가 풀리면 몇 초 내 자동 복구됩니다.</small>
      <button id="offline-hide">가리기 ✕</button>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>해상도</h2>
      <div class="row" id="res-row">
        <button data-res="1080">1080</button>
        <button data-res="720">720</button>
        <button data-res="540">540</button>
        <button data-res="360">360</button>
      </div>
    </div>

    <div class="panel">
      <h2>프레임</h2>
      <div class="row" id="fps-row">
        <button data-fps="60">60 fps</button>
        <button data-fps="30">30 fps</button>
      </div>
      <div class="hint">해상도·프레임 변경 시 약 3초 재연결됩니다.</div>
    </div>

    <div class="panel">
      <h2>마이크</h2>
      <div class="row" id="mic-row">
        <button data-mic="cam" class="active">카메라</button>
        <button data-mic="mac">맥북</button>
      </div>
      <div class="vol">
        <button id="mute" title="음소거">🔇</button>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1">
      </div>
      <div class="hint">선택한 마이크를 양쪽으로 출력. 변경 시 약 3초 재연결. 첫 클릭 시 소리 켜짐.</div>
    </div>

    <div class="panel">
      <h2>녹화</h2>
      <div class="row" id="rec-row">
        <button id="rec-start" class="rec">● 녹화</button>
        <button id="rec-pause" disabled>⏸ 일시정지</button>
        <button id="rec-stop" disabled>⏹ 종료</button>
      </div>
      <div class="hint">모니터링 화질 그대로 로컬 저장 (recordings/). 재인코딩 없음.</div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script src="/static/hls.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const video = $('#v');
let hls = null;
let lastT = -1, lastMove = Date.now();

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'), 2200); }

// ---------- stream ----------
function loadStream(){
  const src = '/cam/index.m3u8';
  lastT = -1; lastMove = Date.now();
  if (hls){ hls.destroy(); hls=null; }
  if (window.Hls && Hls.isSupported()){
    hls = new Hls({ lowLatencyMode:false, liveSyncDurationCount:3, backBufferLength:30, maxBufferLength:30 });
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=> video.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR, (e,d)=>{ if(d.fatal){ setTimeout(loadStream, 1500); } });
  } else {
    video.src = src; video.play().catch(()=>{});
  }
}
// Overlay is driven purely by whether the picture is ADVANCING (currentTime moving).
// A live, moving stream never shows it; only a genuine multi-second freeze does.
// The "가리기" button dismisses it manually until the picture recovers.
let overlayDismissed=false;
$('#offline-hide').addEventListener('click', ()=>{ $('#offline').hidden=true; overlayDismissed=true; });
setInterval(()=>{
  const t = video.currentTime;
  if (Math.abs(t - lastT) > 0.02){ lastT=t; lastMove=Date.now(); overlayDismissed=false; $('#dot').classList.add('live'); $('#offline').hidden=true; }
  else if (Date.now() - lastMove > 8000 && !overlayDismissed){ $('#dot').classList.remove('live'); $('#offline').hidden=false; }
}, 2000);

// ---------- audio (client-side channel routing) ----------
// Audio plays natively from the <video>. The chosen mic is captured server-side
// (stereo, both channels), so no client-side channel routing is needed.
let muted = true;   // starts muted for autoplay; first interaction unmutes
video.volume = parseFloat($('#vol').value);
function enableSound(){ if (video.muted){ video.muted=false; muted=false; $('#mute').textContent='🔊'; } }
$('#mic-row').addEventListener('click', e=>{
  const b = e.target.closest('button[data-mic]'); if(!b) return;
  enableSound();
  if (b.dataset.mic !== cur.audio) applySettings({ audio: b.dataset.mic });
});
$('#vol').addEventListener('input', e=>{
  video.volume = parseFloat(e.target.value);
  if (video.volume > 0) enableSound();
});
$('#mute').addEventListener('click', ()=>{
  muted = !muted; video.muted = muted;
  $('#mute').textContent = muted ? '🔇' : '🔊';
});

// ---------- settings (res / fps) ----------
let cur = { res:'1080', fps:'30', audio:'cam' };
function markActive(){
  document.querySelectorAll('#res-row button').forEach(b=>b.classList.toggle('active', b.dataset.res===cur.res));
  document.querySelectorAll('#fps-row button').forEach(b=>b.classList.toggle('active', b.dataset.fps===cur.fps));
  document.querySelectorAll('#mic-row button').forEach(b=>b.classList.toggle('active', b.dataset.mic===cur.audio));
}
const SETBTNS = '#res-row button,#fps-row button,#mic-row button';
async function applySettings(next){
  const body = { res: next.res||cur.res, fps: next.fps||cur.fps, audio: next.audio||cur.audio };
  document.querySelectorAll(SETBTNS).forEach(b=>b.disabled=true);
  toast('적용 중… 약 3초');
  try{
    const r = await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw 0;
    const j = await r.json();
    cur = { res:j.res, fps:j.fps, audio:j.audio }; markActive();
    setTimeout(()=>{ loadStream(); toast(`${cur.res}p / ${cur.fps}fps / ${cur.audio==='cam'?'카메라':'맥북'} 적용됨`); }, 4200);
  }catch{ toast('설정 변경 실패'); }
  finally{ setTimeout(()=>document.querySelectorAll(SETBTNS).forEach(b=>b.disabled=false), 4300); }
}
$('#res-row').addEventListener('click', e=>{ const b=e.target.closest('button[data-res]'); if(b) applySettings({res:b.dataset.res}); });
$('#fps-row').addEventListener('click', e=>{ const b=e.target.closest('button[data-fps]'); if(b) applySettings({fps:b.dataset.fps}); });

// ---------- recording ----------
let recState='idle', recSince=null, recTimer=null;
function renderRec(){
  const badge=$('#rec-badge');
  $('#rec-start').disabled = (recState==='recording');
  $('#rec-pause').disabled = (recState!=='recording');
  $('#rec-stop').disabled  = (recState==='idle');
  $('#rec-start').textContent = (recState==='paused') ? '● 재개' : '● 녹화';
  badge.classList.toggle('on', recState!=='idle');
  badge.classList.toggle('paused', recState==='paused');
  if (recState==='recording' && recSince){
    if(!recTimer) recTimer=setInterval(tickRec,1000); tickRec();
  } else { clearInterval(recTimer); recTimer=null;
    if(recState==='paused') $('#rec-time').textContent='일시정지'; }
}
function tickRec(){
  if(!recSince) return;
  const s=Math.max(0,Math.floor(Date.now()/1000 - recSince));
  const mm=String(Math.floor(s/60)).padStart(2,'0'), ss=String(s%60).padStart(2,'0');
  $('#rec-time').textContent=`REC ${mm}:${ss}`;
}
async function recCmd(action){
  try{
    const r=await fetch('/api/record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});
    const j=await r.json(); if(!r.ok) throw 0;
    recState=j.record.state; recSince=j.record.since ? j.record.since*1000 : null; renderRec();
    toast({start:'녹화 시작',resume:'녹화 재개',pause:'일시정지',stop:'녹화 종료'}[action]||'');
  }catch{ toast('녹화 명령 실패'); }
}
$('#rec-start').addEventListener('click', ()=> recCmd(recState==='paused'?'resume':'start'));
$('#rec-pause').addEventListener('click', ()=> recCmd('pause'));
$('#rec-stop').addEventListener('click', ()=> recCmd('stop'));

// ---------- init ----------
async function init(){
  loadStream();
  try{
    const j = await (await fetch('/api/status')).json();
    cur = { res:j.res||'1080', fps:j.fps||'30', audio:j.audio||'cam' }; markActive();
    if(j.record){ recState=j.record.state; recSince=j.record.since?j.record.since*1000:null; renderRec(); }
  }catch{}
}
init();
</script>
</body>
</html>
