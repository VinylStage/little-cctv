logLevel: info
logDestinations: [stdout]

api: true
apiAddress: 127.0.0.1:9997

rtmp: false
srt: false
moq: false
webrtc: false

hls: true
hlsAddress: 127.0.0.1:8888
hlsVariant: fmp4
hlsAlwaysRemux: true
hlsSegmentDuration: 1s
hlsSegmentCount: 7

rtsp: true
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:8554

playback: false

pathDefaults:
  record: false

paths:
  cam:
    runOnInit: bash capture.sh
    runOnInitRestart: true
    runOnAvailable: bash motion.sh
    runOnAvailableRestart: true
